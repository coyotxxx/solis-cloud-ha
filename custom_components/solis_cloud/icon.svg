<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Pomarańczowe tło jak oryginał -->
  <rect width="120" height="120" fill="#FF6B1A" rx="12"/>
  
  <!-- Główne słońce (biały outline) -->
  <g transform="translate(35, 35)" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Centralne koło słońca -->
    <circle cx="25" cy="25" r="18"/>
    
    <!-- Promienie słońca - stylizowane jak w oryginale -->
    <g transform="translate(25, 25)">
      <!-- Główne promienie -->
      <path d="M0,-25 L-3,-35 L0,-30 L3,-35 Z"/>
      <path d="M18,-18 L25,-25 L20,-20 L28,-22 Z"/>
      <path d="M25,0 L35,-3 L30,0 L35,3 Z"/>
      <path d="M18,18 L28,22 L20,20 L25,25 Z"/>
      <path d="M0,25 L3,35 L0,30 L-3,35 Z"/>
      <path d="M-18,18 L-25,25 L-20,20 L-28,22 Z"/>
      <path d="M-25,0 L-35,3 L-30,0 L-35,-3 Z"/>
      <path d="M-18,-18 L-28,-22 L-20,-20 L-25,-25 Z"/>
      
      <!-- Dodatkowe małe promienie -->
      <path d="M12,-22 L15,-28 L12,-25 Z"/>
      <path d="M22,-12 L28,-15 L25,-12 Z"/>
      <path d="M22,12 L28,15 L25,12 Z"/>
      <path d="M12,22 L15,28 L12,25 Z"/>
      <path d="M-12,22 L-15,28 L-12,25 Z"/>
      <path d="M-22,12 L-28,15 L-25,12 Z"/>
      <path d="M-22,-12 L-28,-15 L-25,-12 Z"/>
      <path d="M-12,-22 L-15,-28 L-12,-25 Z"/>
    </g>
  </g>
  
  <!-- Koło zębate (tryb mechanizmu) -->
  <g transform="translate(80, 25)" fill="white">
    <!-- Centralne koło -->
    <circle cx="0" cy="0" r="12"/>
    <!-- Zęby koła -->
    <g>
      <rect x="-2" y="-16" width="4" height="6" rx="1"/>
      <rect x="-2" y="10" width="4" height="6" rx="1"/>
      <rect x="10" y="-2" width="6" height="4" rx="1"/>
      <rect x="-16" y="-2" width="6" height="4" rx="1"/>
      <rect x="8" y="-10" width="4" height="4" rx="1" transform="rotate(45 10 -8)"/>
      <rect x="8" y="6" width="4" height="4" rx="1" transform="rotate(-45 10 8)"/>
      <rect x="-12" y="-10" width="4" height="4" rx="1" transform="rotate(-45 -10 -8)"/>
      <rect x="-12" y="6" width="4" height="4" rx="1" transform="rotate(45 -10 8)"/>
    </g>
    <!-- Środkowy punkt -->
    <circle cx="0" cy="0" r="3" fill="#FF6B1A"/>
  </g>
</svg>
